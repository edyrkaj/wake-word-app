<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" role="img" aria-labelledby="title desc">
  <title id="title">ONNX Tiny Wake Word concept</title>
  <desc id="desc">Microphone, audio waveform, log-mel grid, and ONNX cube connected by arrows.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f1f5f9"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="880" height="220" rx="16" fill="url(#bg)" stroke="#cbd5e1" stroke-width="1"/>
  <text x="440" y="48" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="700" fill="#0f172a">Browser wake word to ONNX to speech</text>
  <text x="440" y="74" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#64748b">16 kHz audio, log-mel in JS, inference in WASM</text>
  <g transform="translate(72,100)" filter="url(#shadow)">
    <rect x="0" y="0" width="100" height="88" rx="12" fill="#fff" stroke="#94a3b8"/>
    <ellipse cx="50" cy="32" rx="18" ry="22" fill="none" stroke="#0ea5e9" stroke-width="3"/>
    <path d="M50 54v12M38 72h24" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/>
    <text x="50" y="82" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#475569">Mic</text>
  </g>
  <g transform="translate(200,108)" filter="url(#shadow)">
    <rect x="0" y="0" width="120" height="72" rx="12" fill="#fff" stroke="#94a3b8"/>
    <path d="M12 36 Q24 12 36 36 T60 36 T84 36 T108 24" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
    <text x="60" y="66" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#475569">PCM window</text>
  </g>
  <g transform="translate(348,100)" filter="url(#shadow)">
    <rect x="0" y="0" width="120" height="88" rx="12" fill="#fff" stroke="#94a3b8"/>
    <g stroke="#cbd5e1" stroke-width="1">
      <line x1="16" y1="20" x2="104" y2="20"/><line x1="16" y1="32" x2="104" y2="32"/><line x1="16" y1="44" x2="104" y2="44"/>
      <line x1="16" y1="20" x2="16" y2="52"/><line x1="40" y1="20" x2="40" y2="52"/><line x1="64" y1="20" x2="64" y2="52"/><line x1="88" y1="20" x2="88" y2="52"/>
    </g>
    <rect x="24" y="24" width="72" height="28" rx="4" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e"/>
    <text x="60" y="82" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#475569">Log-mel</text>
  </g>
  <g transform="translate(496,100)" filter="url(#shadow)">
    <rect x="0" y="0" width="100" height="88" rx="12" fill="#fff" stroke="#94a3b8"/>
    <path d="M50 18 L78 34 V62 L50 78 L22 62 V34 Z" fill="#0f172a" opacity="0.9"/>
    <text x="50" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#fff">ONNX</text>
    <text x="50" y="82" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#475569">WASM</text>
  </g>
  <g transform="translate(624,100)" filter="url(#shadow)">
    <rect x="0" y="0" width="184" height="88" rx="12" fill="#fff" stroke="#94a3b8"/>
    <text x="92" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#0f172a">Score &gt; threshold</text>
    <text x="92" y="50" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">then Web Speech API</text>
    <text x="92" y="78" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#475569">Transcript (optional)</text>
  </g>
  <path d="M176 144 H196" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M324 144 H344" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M472 144 H492" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M600 144 H620" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
</svg>
